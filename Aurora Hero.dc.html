<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#09090b;font-family:'Geist',Helvetica,Arial,sans-serif;}a{color:#fafafa}a:hover{color:#a1a1aa}*{box-sizing:border-box}</style>
</helmet>
<section role="banner" aria-label="Hero section" style="position:relative;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#09090b;color:#fafafa;">
  <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;opacity:{{ auroraOpacity }};">
    <div ref="{{ layer1 }}" style="position:absolute;inset:-100%;background:repeating-linear-gradient(100deg,#8b5cf6 10%,#3b82f6 15%,#ec4899 20%,#8b5cf6 25%,#3b82f6 30%);background-size:300% 100%;filter:blur(80px);"></div>
    <div ref="{{ layer2 }}" style="position:absolute;inset:-10px;background:repeating-linear-gradient(100deg,rgba(139,92,246,0.1) 0%,rgba(139,92,246,0.1) 7%,transparent 10%,transparent 12%,rgba(139,92,246,0.1) 16%),repeating-linear-gradient(100deg,#8b5cf6 10%,#3b82f6 15%,#ec4899 20%,#8b5cf6 25%,#3b82f6 30%);background-size:200%,100%;background-position:50% 50%,50% 50%;mix-blend-mode:difference;"></div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,0.8) 100%);"></div>
  <div style="position:relative;z-index:10;width:100%;max-width:1400px;margin:0 auto;padding:0 24px;text-align:center;">
    <div ref="{{ content }}" style="max-width:1024px;margin:0 auto;">
      <h1 ref="{{ titleEl }}" style="font-size:clamp(48px,9vw,128px);line-height:1;font-weight:700;margin:0 0 32px;letter-spacing:-0.025em;">
        <sc-for list="{{ words }}" as="word" hint-placeholder-count="3">
          <span style="display:inline-flex;margin:0 8px 8px;">
            <sc-for list="{{ word.letters }}" as="l" hint-placeholder-count="5">
              <span data-letter="1" data-delay="{{ l.delay }}" style="display:inline-block;color:transparent;background-image:linear-gradient(to bottom right,#fafafa,rgba(250,250,250,0.9),rgba(250,250,250,0.7));-webkit-background-clip:text;background-clip:text;cursor:default;transition:transform 0.2s;" style-hover="transform:scale(1.1);">{{ l.ch }}</span>
            </sc-for>
          </span>
        </sc-for>
      </h1>
      <p ref="{{ descEl }}" style="font-size:clamp(16px,1.6vw,20px);color:#a1a1aa;margin:0 auto 36px;max-width:620px;line-height:1.55;text-wrap:balance;">Client leve e rápido para Minecraft 1.8.9. Módulos essenciais, menu moderno e instalação em um clique.</p>
      <div ref="{{ actionsEl }}" style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;">
        <a id="download" href="{{ url }}" download="GyroLoader.exe" aria-label="Baixar GyroLoader.exe para Windows" style="display:inline-flex;align-items:center;gap:10px;padding:16px 32px;font:600 18px 'Geist',Helvetica,sans-serif;text-decoration:none;border-radius:9999px;background:#fafafa;color:#18181b;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);transition:all 0.3s;" style-hover="background:rgba(250,250,250,0.9);color:#18181b;box-shadow:0 20px 25px -5px rgba(0,0,0,0.4);">
          <span aria-hidden="true" style="font-size:20px;line-height:1;">↓</span>
          <span>Baixar para Windows</span>
        </a>
        <a href="{{ page }}" target="_blank" rel="noopener" style="padding:16px 32px;font:600 18px 'Geist',Helvetica,sans-serif;text-decoration:none;border-radius:9999px;background:#27272a;color:#fafafa;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);transition:all 0.3s;" style-hover="background:rgba(39,39,42,0.9);color:#fafafa;box-shadow:0 20px 25px -5px rgba(0,0,0,0.4);">Changelog</a>
      </div>
      <div style="margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:#a1a1aa;">
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;">
          <span>v{{ version }}</span>
          <span aria-hidden="true">·</span>
          <span>GyroLoader.exe</span>
          <span aria-hidden="true">·</span>
          <span>{{ size }}</span>
          <span aria-hidden="true">·</span>
          <span>Windows 10/11 x64</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:100%;">
          <span>SHA-256</span>
          <code style="font:12px ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:#d4d4d8;background:rgba(39,39,42,0.7);padding:4px 8px;border-radius:6px;word-break:break-all;">{{ sha256 }}</code>
          <button onClick="{{ copySha }}" aria-label="Copiar SHA-256" style="font:600 12px 'Geist',Helvetica,sans-serif;color:#fafafa;background:transparent;border:1px solid #3f3f46;border-radius:6px;padding:4px 10px;cursor:pointer;" style-hover="border-color:#a1a1aa;">{{ copyLabel }}</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;">
          <a href="https://github.com/NyxDevidk/GyroClient-releases/releases/download/v1.0.0/GyroLoader.exe" style="color:#a1a1aa;">Baixar v1.0.0 (link fixo)</a>
          <a href="{{ github }}" target="_blank" rel="noopener" style="color:#a1a1aa;">GitHub</a>
          <sc-if value="{{ hasDiscord }}" hint-placeholder-val="{{ false }}">
            <a href="{{ discord }}" target="_blank" rel="noopener" style="color:#a1a1aa;">Discord</a>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Eleve sua Jogabilidade&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;auroraOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.4,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.25,&quot;max&quot;:4,&quot;step&quot;:0.25,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  layer1 = React.createRef(); layer2 = React.createRef(); content = React.createRef();
  titleEl = React.createRef(); descEl = React.createRef(); actionsEl = React.createRef();
  RELEASE = {
    version: "1.0.0",
    size: "2,82 MB",
    sha256: "30b817e13f5ad46f4c3ef112ad274718f5669856541f0a47a265cdc35c3aeab8",
    url: "https://github.com/NyxDevidk/GyroClient-releases/releases/latest/download/GyroLoader.exe",
    manifest: "https://github.com/NyxDevidk/GyroClient-releases/releases/latest/download/manifest.json",
    page: "https://github.com/NyxDevidk/GyroClient-releases/releases",
    github: "https://github.com/NyxDevidk/GyroClient-releases",
    discord: ""
  };
  state = { rel: this.RELEASE, copied: false };
  componentDidMount() {
    setTimeout(() => this.play(), 50);
    fetch(this.RELEASE.manifest).then(r => r.ok ? r.json() : null).then(m => {
      if (!m) return;
      const rel = { ...this.state.rel };
      if (m.version) rel.version = String(m.version).replace(/^v/, '');
      if (m.loader_sha256) rel.sha256 = m.loader_sha256;
      if (m.size) rel.size = m.size;
      this.setState({ rel });
    }).catch(() => {});
  }
  componentDidUpdate(p) { if (p.title !== this.props.title) setTimeout(() => this.play(), 50); }
  play() {
    const sp = this.props.speed ?? 1;
    this.layer1.current?.animate([{ backgroundPosition: '0% 50%' }, { backgroundPosition: '100% 50%' }, { backgroundPosition: '0% 50%' }], { duration: 20000 / sp, iterations: Infinity });
    this.layer2.current?.animate([{ backgroundPosition: '50% 50%, 50% 50%' }, { backgroundPosition: '100% 50%, 150% 50%' }, { backgroundPosition: '50% 50%, 50% 50%' }], { duration: 15000 / sp, iterations: Infinity });
    this.content.current?.animate([{ opacity: 0, transform: 'translateY(50px)' }, { opacity: 1, transform: 'none' }], { duration: 1200, easing: 'ease-out', fill: 'backwards' });
    this.titleEl.current?.querySelectorAll('[data-letter]').forEach(el => {
      el.animate([{ transform: 'translateY(100px)', opacity: 0, filter: 'blur(8px)' }, { transform: 'none', opacity: 1, filter: 'blur(0px)' }],
        { duration: 900, delay: +el.dataset.delay * 1000, easing: 'cubic-bezier(.3,1.35,.55,1)', fill: 'backwards' });
    });
    this.descEl.current?.animate([{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], { duration: 1000, delay: 600, fill: 'backwards' });
    this.actionsEl.current?.animate([{ opacity: 0, transform: 'scale(0.9)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: 1000, fill: 'backwards' });
  }
  renderVals() {
    const title = this.props.title ?? 'Eleve sua Jogabilidade';
    const rel = this.state.rel;
    const words = title.split(' ').map((w, wi) => ({ letters: w.split('').map((ch, li) => ({ ch, delay: wi * 0.1 + li * 0.03 })) }));
    return {
      words, auroraOpacity: this.props.auroraOpacity ?? 0.4,
      layer1: this.layer1, layer2: this.layer2, content: this.content, titleEl: this.titleEl, descEl: this.descEl, actionsEl: this.actionsEl,
      version: rel.version, size: rel.size, sha256: rel.sha256, url: rel.url, page: rel.page,
      github: rel.github, discord: rel.discord, hasDiscord: !!rel.discord,
      copyLabel: this.state.copied ? 'Copiado' : 'Copiar',
      copySha: () => { navigator.clipboard?.writeText(rel.sha256); this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1500); },
    };
  }
}
</script>
</body>
</html>
